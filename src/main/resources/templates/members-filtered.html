<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Filtrirani članovi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a class="brand" th:href="@{/}">Biblioteka</a>
        <div class="nav-links">
            <a class="nav-link" th:href="@{/members}">Članovi</a>
            <a class="nav-link" th:href="@{/books}">Knjige</a>
            <a class="nav-link" th:href="@{/loans}">Pozajmice</a>
        </div>
    </div>
</nav>

<main class="container">
    <section class="page-card">
        <h1>Filtrirani članovi</h1>
        <p class="hint">Prikaz članova koji imaju najmanje <strong th:text="${amount}">0</strong> novca.</p>
        <div class="table-wrapper">
            <table>
                <thead>
    <tr>
        <th>ID</th>
        <th>Ime</th>
        <th>Prezime</th>
        <th>Novac</th>
    </tr>
                </thead>
                <tbody>
    <tr th:each="member : ${members}">
        <td th:text="${member.id}">1</td>
        <td th:text="${member.name}"></td>
        <td th:text="${member.surname}"></td>
        <td th:text="${member.cash}"></td>
    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
