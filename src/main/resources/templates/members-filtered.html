<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Members filtered</title>
</head>
<body>
<h1>Our members with <span th:text="${amount}">0</span> </h1>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Surname</th>
        <th>Cash</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="member : ${members}">
        <td th:text="${member.id}">1</td>
        <td th:text="${member.name}"></td>
        <td th:text="${member.surname}"></td>
        <td th:text="${member.cash}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
