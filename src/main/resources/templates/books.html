<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Knjige</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a class="brand" th:href="@{/}">Biblioteka</a>
        <div class="nav-links">
            <a class="nav-link" th:href="@{/members}">Članovi</a>
            <a class="nav-link" th:href="@{/books}">Knjige</a>
            <a class="nav-link" th:href="@{/loans}">Pozajmice</a>
        </div>
    </div>
</nav>

<main class="container">
    <section class="page-card">
        <h1>Spisak knjiga</h1>
        <p class="subtitle">Pregled knjiga koje su dostupne u sistemu.</p>
        <div class="table-wrapper">
            <table>
                <thead>
        <tr>
            <th>ID</th>
            <th>Naslov</th>
            <th>Autor</th>
            <th>Cijena</th>
        </tr>
                </thead>
                <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.price}"></td>
        </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
